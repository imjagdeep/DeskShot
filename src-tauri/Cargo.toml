[package]
name = "deskshot"
version = "0.2.0"
description = "Offline screenshots: capture, mark up, blur, copy text, pin"
license = "MIT"
edition = "2021"

[lib]
# `_lib` keeps the lib name distinct from the bin on Windows (cargo#8519).
name = "deskshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Optional DeskLab account (account.rs): HTTPS with the same rustls + ring the
# updater uses, the OS keychain for the sign-in, and the computer's name.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = "4"
gethostname = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
